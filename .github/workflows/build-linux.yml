name: build-linux

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      sync:
        description: "Pull latest upstream main before building"
        required: false
        type: boolean
        default: true
      containerized:
        description: "Build inside the electronuserland/builder Docker image (glibc 2.27 baseline)."
        required: false
        type: boolean
        default: false

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux x64 AppImage
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.locations.outputs.version }}
      appimage_name: ${{ steps.locations.outputs.appimage_name }}
      built: ${{ steps.locations.outputs.built }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Sync upstream main
        id: sync
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/nexu-io/open-design.git
          git fetch upstream main --tags
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "upstream unchanged, skipping build"
            echo "new_upstream=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge upstream/main --no-edit; then
            # Upstream occasionally edits workflow files we intentionally keep
            # deleted, which git reports as delete/modify conflicts. Auto-resolve
            # any conflict inside .github/workflows by keeping our deletion.
            git checkout --ours .github/workflows 2>/dev/null || true
            git add .github/workflows
            if ! git diff --name-only --diff-filter=U --quiet; then
              echo "::error::merge conflict outside .github/workflows; resolve manually then re-run"
              exit 1
            fi
          fi
          echo "merged upstream/main"
          # Keep ONLY build-linux.yml. Upstream restores all the release/bot
          # workflows on every merge, so prune them again before pushing.
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name 'build-linux.yml' -delete
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: sync upstream and prune workflows"
            git push origin HEAD:main
            echo "pushed sync commit"
          fi
          echo "new_upstream=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          steps.sync.outputs.new_upstream == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - name: Setup Node.js
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          steps.sync.outputs.new_upstream == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          steps.sync.outputs.new_upstream == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Linux AppImage
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          steps.sync.outputs.new_upstream == 'true'
        run: |
          set -euo pipefail
          tools_pack_dir="$RUNNER_TEMP/tools-pack"
          namespace="github-build"
          build_args=(
            exec tools-pack linux build
            --dir "$tools_pack_dir"
            --namespace "$namespace"
            --portable
            --to appimage
            --json
          )
          if [ "${{ github.event.inputs.containerized == 'true' }}" = "true" ]; then
            build_args+=(--containerized)
          fi
          pnpm "${build_args[@]}"

      - name: Locate AppImage
        id: locations
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          steps.sync.outputs.new_upstream == 'true'
        run: |
          set -euo pipefail
          appimage="$(find "$RUNNER_TEMP/tools-pack/out/linux/namespaces/github-build/builder" -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "$appimage" ]; then
            echo "::error::AppImage not found under tools-pack output root"
            exit 1
          fi
          echo "path=$appimage" >> "$GITHUB_ENV"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "appimage_name=$(basename "$appimage")" >> "$GITHUB_OUTPUT"
          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "AppImage: $appimage"

      - name: Upload AppImage artifact
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          steps.sync.outputs.new_upstream == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: open-design-linux-appimage
          path: ${{ env.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.sync.outputs.new_upstream }}" = "false" ]; then
            echo "No new upstream commits — build skipped."
          elif [ "${{ steps.locations.outputs.built }}" = "true" ]; then
            echo "Built and published successfully."
          fi

  publish_release:
    name: Publish GitHub Release
    needs: build_linux
    if: needs.build_linux.outputs.built == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build_linux.outputs.version }}
      APPIMAGE_NAME: ${{ needs.build_linux.outputs.appimage_name }}
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: open-design-linux-appimage
          path: dist

      - name: Create rolling GitHub Release
        run: |
          set -euo pipefail
          appimage="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          if [ -z "$appimage" ]; then
            echo "::error::AppImage not found in downloaded artifact"
            exit 1
          fi
          tag="open-design-linux"
          title="Open Design Linux AppImage v${VERSION}"
          body=$(printf 'Auto-built from commit `%s` on %s.\n\n- 构建时间: %s\n- 版本: %s\n- 文件: %s' \
            "${GITHUB_SHA:0:7}" \
            "${GITHUB_REF_NAME}" \
            "$(TZ=UTC date -u +'%Y-%m-%d %H:%M UTC')" \
            "${VERSION}" \
            "${APPIMAGE_NAME}")
          # Replace any previous rolling release so the tag always points at the newest build.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$tag" "$appimage" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes "$body"
          echo "Released: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"